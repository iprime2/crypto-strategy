name: Pull request

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    name: Rust build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cex-mm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cex-mm
      - name: Test workspace
        run: cargo test --workspace --locked

  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cex-mm/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cex-mm/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  python:
    name: Python script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The scripts are stdlib-only on the runner's stock python3 (3.10+ syntax); test_live_sh.py needs
      # Linux (/proc, setsid), which ubuntu-latest has. Run the suite one copy per machine: live.sh start
      # scans /proc for any `mm-bot run` process, so two concurrent runs (two worktrees) make test_live_sh
      # fail at random; CI jobs are isolated VMs, so this job is fine.
      - run: python3 --version
      - run: python3 -m unittest discover -s cex-mm/scripts -p 'test_*.py' -v
      - run: python3 -m unittest discover -s bitra-desk/dashboard -p 'test_*.py' -v
      - run: python3 -m unittest discover -s bitra-desk/paper -p 'test_*.py' -v

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C /tmp
          /tmp/gitleaks detect --source . --redact --verbose --no-banner
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust dependency audit
        working-directory: cex-mm
        run: |
          cargo install cargo-audit --locked
          # rsa 0.9 (via sqlx) has RUSTSEC-2023-0071 and no fixed release.
          cargo audit --ignore RUSTSEC-2023-0071
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cex-mm/web/package-lock.json
      - name: npm audit
        working-directory: cex-mm/web
        run: |
          npm ci
          # Only packages that ship in the browser bundle; build tooling (shadcn CLI) is a devDependency.
          npm audit --omit=dev --audit-level=high
